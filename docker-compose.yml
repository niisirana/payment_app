services:
  db:
    image: postgres:15-alpine
    
    container_name: prolongation_db_container
    
    restart: always

    env_file:
      - .env

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    ports:
      - "5444:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: